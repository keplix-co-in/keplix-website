name: Deploy to Vercel

on:
  push:
    branches: [ main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    # The CLI authenticates from --token, not from a VERCEL_TOKEN environment
    # variable, so the flag has to be passed explicitly. It is written as
    # "$VERCEL_TOKEN" rather than ${{ secrets.VERCEL_TOKEN }} so the secret is
    # read from the job env at runtime instead of being interpolated into the
    # generated shell script.
    - name: Pull Vercel Environment
      run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - name: Build Project Artifacts
      run: vercel build --prod --token="$VERCEL_TOKEN"

    - name: Deploy Project Artifacts to Vercel
      run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
