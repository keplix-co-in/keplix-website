name: Deploy to Vercel

on:
  push:
    branches: [ main]

jobs:
  # Gate added 2026-09-14 (audit F31): this workflow deployed straight to
  # production on every push to main with no lint or build check at all.
  # `npm run lint` was itself broken (used the invalid --ext flag with this
  # project's flat eslint.config.js, so it errored on every run rather than
  # actually checking anything -- fixed the same day this gate was added).
  # There is still no test script/framework in this project (F30's other
  # half); `npm run build` at least exercises the SSR + prerender pipeline,
  # which is where a real regression here would most likely surface.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Same Arborist edgesOut bug as the deploy job below -- see its comment.
      # Pinned to an EXACT version, not the floating "npm@11" tag: that tag
      # resolved to 11.19.1 on 2026-09-15 (was 11.7.0 when this pin was
      # written) and broke `npm ci` here -- a newer 11.x tightened lockfile
      # sync checks around optional peer dependencies, so `npm ci` rejected
      # this project's lockfile with "Missing: nuxt@4.5.2 from lock file" and
      # ~300 similar lines for packages this project doesn't depend on at all
      # (they're optional peers of unrelated devDependencies, never installed
      # here). Re-run `npm install` locally with this exact npm version
      # before bumping it, and confirm `npm ci` succeeds, rather than
      # widening back to a floating tag.
      - name: Pin npm to a known-good version
        run: npm install --global npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # There was no Node/npm setup step at all here before -- the job ran
    # whatever npm ships with the ubuntu-latest image, which drifts over time.
    # It landed on npm 10.9.8, which has a known Arborist bug
    # ("Cannot read properties of null (reading 'edgesOut')") that this repo's
    # lockfile triggers -- specifically because it carries 121 optional
    # platform-specific esbuild/rollup binaries (one per OS/arch Vite might
    # build on), a shape that crashes 10.x's dependency-graph resolver but not
    # 11.x's. `npm install` reproduces this crash-free locally with npm 11.7.0,
    # confirming the lockfile itself is fine -- this is an npm-version bug, not
    # a project bug. Pinning both Node and npm keeps the runner matching what
    # was actually tested, instead of silently drifting to whatever ships next.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Pinned to an exact version -- see the test job's step above for why
    # the floating "npm@11" tag broke `npm ci` on 2026-09-15.
    - name: Pin npm to a known-good version
      run: npm install --global npm@11.7.0

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Link Vercel Project
      run: vercel link --yes --project="${{ github.event.repository.name }}" --token="$VERCEL_TOKEN"

    # The CLI authenticates from --token, not from a VERCEL_TOKEN environment
    # variable, so the flag has to be passed explicitly. It is written as
    # "$VERCEL_TOKEN" rather than ${{ secrets.VERCEL_TOKEN }} so the secret is
    # read from the job env at runtime instead of being interpolated into the
    # generated shell script.
    - name: Pull Vercel Environment
      run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - name: Build Project Artifacts
      run: vercel build --prod --token="$VERCEL_TOKEN"

    - name: Deploy Project Artifacts to Vercel
      run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
